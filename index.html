<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub | Smart Learning</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #f5f7ff;
    color: #172033;
    line-height: 1.6;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #2563eb, #6366f1);
    color: white;
    text-align: center;
    padding: 55px 20px;
}

header h1 {
    font-size: 42px;
    margin-bottom: 8px;
}

header p {
    font-size: 18px;
}

/* NAVIGATION */

nav {
    background: #111827;
    padding: 14px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
    font-weight: bold;
}

nav a:hover {
    color: #93c5fd;
}

/* HERO */

.hero {
    background: white;
    text-align: center;
    padding: 65px 20px;
}

.hero h2 {
    font-size: 34px;
    color: #2563eb;
    margin-bottom: 15px;
}

.hero p {
    max-width: 750px;
    margin: auto;
    color: #555;
}

.hero button {
    margin-top: 25px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 24px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
}

/* GENERAL */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 45px 20px;
}

.section-title {
    text-align: center;
    color: #1e3a8a;
    margin-bottom: 30px;
    font-size: 28px;
}

/* SUBJECTS */

.subjects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    transition: 0.25s;
}

.card:hover {
    transform: translateY(-7px);
}

.card .icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.card h3 {
    color: #2563eb;
    margin-bottom: 10px;
}

/* NCERT */

.ncert {
    margin-top: 45px;
}

.ncert-box {
    background: linear-gradient(135deg, #eef2ff, #ffffff);
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.07);
}

.ncert-box p {
    margin-bottom: 20px;
    color: #555;
}

.ncert-button {
    display: inline-block;
    background: #2563eb;
    color: white;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 8px;
    margin: 5px;
    font-weight: bold;
}

.ncert-button:hover {
    background: #1d4ed8;
}

.tips {
    background: white;
